name: CI

on:
  pull_request:
  push:
    branches: [main, "rewrite/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: node scripts/check-legacy-absence.mjs
      - run: npm run typecheck && npm run lint && npm test && npm run build
