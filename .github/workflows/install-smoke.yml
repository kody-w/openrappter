name: Install Smoke Tests

on:
  workflow_call:
    inputs:
      release_artifact_name:
        description: Use the caller's already-built npm tarball
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    paths: &install-smoke-paths
      - '**/*.sh'
      - 'install.sh'
      - 'docs/install.sh'
      - 'tests/install/**'
      - 'tests/test_install.sh'
      - 'typescript/package.json'
      - 'typescript/package-lock.json'
      - 'python/pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths: *install-smoke-paths

concurrency:
  group: install-smoke-${{ github.event_name }}-${{ github.event_name == 'workflow_call' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  powershell-contract:
    name: PowerShell precedence and SemVer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/test_install_ps1.ps1

  unit-tests:
    name: Unit tests (install.sh functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run install.sh unit tests
        run: bash tests/test_install.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      # Every shell script, not just install.sh. Lint that covers one file out
      # of nineteen says nothing about the other eighteen, and the repository
      # ships operational scripts — a pinned installer, a deploy script, an
      # attachment sender — that are exactly where a quoting mistake hurts.
      #
      # Discovered rather than listed. A newer shellcheck may introduce checks
      # that fail here; that is the intended trade, and the fix is a directive
      # with a reason next to the line, as the existing ones carry.
      - name: Run shellcheck on every shell script
        run: |
          set -uo pipefail
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(
            find . -name '*.sh' \
              -not -path './.git/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/.build/*' \
              | sort
          )
          # Anti-vacuity: a find that matched nothing would pass silently.
          if [ "${#scripts[@]}" -lt 15 ]; then
            echo "::error::expected at least 15 shell scripts, found ${#scripts[@]}"
            exit 1
          fi
          status=0
          for script in "${scripts[@]}"; do
            if ! shellcheck "$script"; then
              echo "::error::shellcheck findings in $script"
              status=1
            fi
          done
          echo "shellchecked ${#scripts[@]} scripts"
          exit $status

  docs-sync:
    name: Verify the docs/ installer copies are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Three installers are served from docs/ for GitHub Pages and must match
      # the canonical copies at the repository root. This used to compare
      # install.sh alone, so editing install.ps1 or install.bat and forgetting
      # the docs/ copy would have shipped a stale script to every Windows user
      # piping from Pages, with nothing to catch it.
      #
      # Discovered rather than listed, so a fourth pair is covered the day it
      # appears.
      - name: Check every docs/ installer matches its canonical copy
        run: |
          set -uo pipefail
          checked=0
          status=0
          for canonical in install.*; do
            [ -f "$canonical" ] || continue
            served="docs/$canonical"
            if [ ! -f "$served" ]; then
              echo "::error::$canonical has no served copy at $served"
              status=1
              continue
            fi
            if ! diff -u "$canonical" "$served"; then
              echo "::error::$served has drifted from $canonical"
              status=1
            fi
            checked=$((checked + 1))
          done
          # Anti-vacuity: a glob that matched nothing would pass silently.
          if [ "$checked" -lt 3 ]; then
            echo "::error::expected at least 3 installer pairs, compared $checked"
            exit 1
          fi
          echo "compared $checked installer pairs"
          exit $status

  docker-smoke:
    name: Docker smoke test (npm method)
    runs-on: ubuntu-latest
    needs: [unit-tests, shellcheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build npm tarball
        if: inputs.release_artifact_name == ''
        run: cd typescript && npm install --no-fund --no-audit && npm run build && npm run pack:locked
      - name: Download already-built release tarball
        if: inputs.release_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_artifact_name }}
          path: release-dist
      - name: Copy artifacts to Docker context
        if: inputs.release_artifact_name == ''
        run: |
          cp install.sh tests/install/docker/smoke/install.sh
          cp typescript/openrappter-*.tgz tests/install/docker/smoke/
      - name: Copy release artifact to Docker context
        if: inputs.release_artifact_name != ''
        run: |
          cp install.sh tests/install/docker/smoke/install.sh
          cp release-dist/openrappter-*.tgz tests/install/docker/smoke/
      - name: Build and run smoke test
        run: docker build --no-cache -t openrappter-test-smoke tests/install/docker/smoke/

  docker-nonroot:
    name: Docker non-root test
    runs-on: ubuntu-latest
    needs: [unit-tests, shellcheck]
    steps:
      - uses: actions/checkout@v4
      - name: Copy install.sh to Docker context
        run: cp install.sh tests/install/docker/nonroot/install.sh
      - name: Build and run non-root test
        run: docker build --no-cache -t openrappter-test-nonroot tests/install/docker/nonroot/

  docker-git:
    name: Docker git method test
    runs-on: ubuntu-latest
    needs: [unit-tests, shellcheck]
    steps:
      - uses: actions/checkout@v4
      - name: Copy install.sh to Docker context
        run: cp install.sh tests/install/docker/git-method/install.sh
      - name: Build and run git method test
        env:
          AUTHORITY_REF: 1985eb8cd4d3b80155bcc0c6bc0a0622de7f47ec
        run: >-
          docker build --no-cache
          --build-arg AUTHORITY_REF="$AUTHORITY_REF"
          -t openrappter-test-git
          tests/install/docker/git-method/
