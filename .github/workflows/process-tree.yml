name: Managed Process Tree

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-tree:
    name: process-tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci

      - name: Run focused process-tree tests
        working-directory: typescript
        run: >-
          npx vitest run src/infra/process-tree.test.ts
          --reporter=default --reporter=json
          --outputFile.json=process-tree-report.json

      - name: Verify platform test coverage
        working-directory: typescript
        run: node ../tools/process-tree-report.mjs process-tree-report.json ${{ runner.os }}

      - name: Build server package
        working-directory: typescript
        run: npm run build:server

      - name: Upload focused test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: process-tree-report-${{ runner.os }}
          path: typescript/process-tree-report.json
          if-no-files-found: warn
