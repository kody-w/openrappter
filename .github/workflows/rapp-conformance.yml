name: rapp-conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The credential scan (R9) needs the broker; without it R9 reports SKIP
      # rather than passing silently.
      - name: Install RAPP Keyring
        run: curl -fsSL https://kody-w.github.io/rapp-keyring/install.sh | bash
        continue-on-error: true

      - name: RAPP conformance
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          python3 conformance.py

      - name: Conformance report
        if: always()
        run: python3 conformance.py --json > rapp-conformance.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapp-conformance
          path: rapp-conformance.json
