name: Release macOS Menu Bar
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit of the finalized candidate containing macOS Bar
        required: true
        type: string
      version:
        description: Exact stable X.Y.Z version of that candidate
        required: true
        type: string
concurrency:
  group: openrappter-release-macos-${{ inputs.version }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  release-constitution:
    name: Release Constitution
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      version: ${{ steps.verify.outputs.version }}
      dmg_sha256: ${{ steps.verify.outputs.dmg_sha256 }}
      bundle_sha256: ${{ steps.verify.outputs.bundle_sha256 }}
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kody-w/openrappter-release-train
          ref: 931dd60f77c1e8b3a5c096fae6a5969061ccf569
          path: authority
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12' }
      - name: Validate exact source and version on canonical main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
      - name: Materialize the exact candidate including signed Bar bytes
        run: |
          python scripts/bar_candidate.py materialize --output bar-release \
            --commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION"
      - name: Verify all four finalized receipts and every local candidate artifact
        run: |
          python authority/scripts/release_gate.py \
            --policy authority/contracts/release-constitution-v1.json \
            --release bar-release/release.json --remote \
            --local-artifacts-dir bar-release/release-dist
      - name: Preserve the validated immutable receipt references for cask review
        run: |
          PYTHONPATH=authority/scripts python - <<'PY'
          import json
          from pathlib import Path
          from release_gate import fetch_chain, load_policy, validate_chain
          release=json.load(open("bar-release/release.json"))
          chain=fetch_chain(release)
          validate_chain(release,chain,load_policy(Path("authority/contracts/release-constitution-v1.json")))
          json.dump(chain,open("bar-release/chain.json","w"),indent=2,sort_keys=True)
          PY
      - name: Bind the verified native artifact to downstream jobs
        id: verify
        run: |
          set -euo pipefail
          sha="$(python scripts/bar_candidate.py verify --root bar-release/release-dist \
            --commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION")"
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$(python -c 'import json; print(json.load(open("bar-release/release.json"))["artifact_sha256"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-bar-candidate
          path: bar-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify-dmg:
    name: Verify receipted DMG without mutation (${{ matrix.runner }})
    needs: release-constitution
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ needs.release-constitution.outputs.commit }}
      RELEASE_VERSION: ${{ needs.release-constitution.outputs.version }}
      DMG_SHA256: ${{ needs.release-constitution.outputs.dmg_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ needs.release-constitution.outputs.commit }}' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: verified-bar-candidate, path: bar-release }
      - name: Verify candidate bytes, Developer ID, stapled ticket, architecture and version
        run: |
          set -euo pipefail
          python3 scripts/bar_candidate.py verify --root bar-release/release-dist \
            --commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION" --expected-sha "$DMG_SHA256"
          bash macos/scripts/verify-dmg.sh \
            "bar-release/release-dist/OpenRappter-Bar-${RELEASE_VERSION}.dmg" \
            "$RELEASE_VERSION" "$DMG_SHA256" "$SOURCE_COMMIT"

  publish:
    name: Publish only the verified receipted Bar artifact
    needs: [release-constitution, verify-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.release-constitution.outputs.commit }}
      RELEASE_VERSION: ${{ needs.release-constitution.outputs.version }}
      RELEASE_TAG: v${{ needs.release-constitution.outputs.version }}-bar
      DMG_SHA256: ${{ needs.release-constitution.outputs.dmg_sha256 }}
      BUNDLE_SHA256: ${{ needs.release-constitution.outputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release-constitution.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: verified-bar-candidate, path: bar-release }
      - name: Recheck exact artifact before tag or publication
        run: |
          set -euo pipefail
          echo "$BUNDLE_SHA256  bar-release/candidate.tar.gz" | sha256sum -c -
          python3 scripts/bar_candidate.py verify --root bar-release/release-dist \
            --commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION" --expected-sha "$DMG_SHA256"
      - name: Produce the frozen first-launch proof only after constitution verification
        run: |
          python3 scripts/bar_candidate.py cask --root bar-release/release-dist \
            --commit "$SOURCE_COMMIT" --version "$RELEASE_VERSION" --expected-sha "$DMG_SHA256" \
            --evidence bar-release/authority-evidence.json --chain bar-release/chain.json \
            --output homebrew-proposal
      - name: Create only the constitution-authorized native tag
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_COMMIT"
          else
            git config user.name github-actions
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$RELEASE_TAG" "$SOURCE_COMMIT" -m "Constitution-finalized Bar $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish unchanged DMG, runtime archives and frozen first-launch proof
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_COMMIT }}
          name: OpenRappter Bar ${{ env.RELEASE_VERSION }}
          body: |
            Signed with Apple Developer ID, notarized, and stapled before ring promotion.
            This release reuses the exact macOS Bar bytes in the finalized candidate.
            Download the DMG and drag OpenRappter Bar to Applications. Requires macOS 14+.
            First launch downloads the pinned official Node and dependency-complete runtime
            for this exact release, after verifying all four immutable release receipts.
            No system Node, npm install, or compiler is needed. Internet access is required
            for first-launch setup; the DMG intentionally does not bundle the runtime.
            A Homebrew update is prepared separately as a receipt-bound review proposal.
          files: |
            bar-release/release-dist/OpenRappter-Bar-${{ env.RELEASE_VERSION }}.dmg
            bar-release/release-dist/OpenRappter-Bar-${{ env.RELEASE_VERSION }}.dmg.sha256
            bar-release/release-dist/macos-bar.json
            bar-release/release-dist/openrappter-runtime-${{ env.RELEASE_VERSION }}-darwin-arm64.tar.gz
            bar-release/release-dist/openrappter-runtime-${{ env.RELEASE_VERSION }}-darwin-x86_64.tar.gz
            homebrew-proposal/runtime-bootstrap-proof.json
          fail_on_unmatched_files: true
          overwrite_files: false
      - name: Verify the actual public downloads against the exact authorized bytes
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo kody-w/openrappter \
            --dir downloaded-bar
          echo "$DMG_SHA256  downloaded-bar/OpenRappter-Bar-${RELEASE_VERSION}.dmg" | sha256sum -c -
          cmp homebrew-proposal/runtime-bootstrap-proof.json downloaded-bar/runtime-bootstrap-proof.json
          for arch in arm64 x86_64; do
            file="openrappter-runtime-${RELEASE_VERSION}-darwin-${arch}.tar.gz"
            cmp "bar-release/release-dist/$file" "downloaded-bar/$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebrew-proposal-${{ env.RELEASE_VERSION }}
          path: homebrew-proposal/
          if-no-files-found: error
          retention-days: 30
