name: Release Constitution

on:
  pull_request:
  push:
    branches: [main, "rewrite/**"]

permissions:
  contents: read

jobs:
  release-constitution:
    name: Release Constitution
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-release-constitution.mjs
      - run: node scripts/run-acceptance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: RAPP-Work-acceptance
          path: packages/release/dist/acceptance/*.json
          if-no-files-found: error
