name: Release Constitution
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-constitution:
    name: Release Constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install locked runtime schema test dependencies without lifecycle scripts
        working-directory: typescript
        run: npm ci --ignore-scripts
      - run: |
          node --test tools/release-constitution-static.test.mjs \
            scripts/candidate-bundle.test.mjs scripts/verify-pages-installer.test.mjs \
            scripts/delivery-workflows.test.mjs scripts/release-preflight.test.mjs
          python3 -m unittest tests/test_release_journey.py -v
          python3 -m unittest discover -s tests -p 'test_bar_*.py' -v
          node tools/release-constitution-static.mjs
