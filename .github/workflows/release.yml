name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-bar'

# Serialize retries of the same package tag without allowing a newer tag or
# the separate macOS lane to replace a pending release.
concurrency:
  group: openrappter-release-packages-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Require release commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      # Install the TypeScript loader without running prepare (which builds).
      - name: Install TypeScript dependencies without build scripts
        working-directory: typescript
        run: npm ci --ignore-scripts

      - name: Test deterministic preflight
        run: node --test scripts/release-preflight.test.mjs

      - name: Gate Rapter Clever Girl Observe Mode
        run: node scripts/rapter-clever-girl-gate.mjs

      - name: Validate tag and versions
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          typescript_runtime_version="$(
            cd typescript
            node --import tsx --input-type=module \
              --eval "import { VERSION } from './src/version.ts'; process.stdout.write(VERSION);"
          )"
          python_runtime_version="$(
            PYTHONPATH=python python -c \
              'from openrappter import __version__; print(__version__, end="")'
          )"

          node scripts/release-preflight.mjs \
            --tag "$GITHUB_REF_NAME" \
            --typescript-runtime-version "$typescript_runtime_version" \
            --python-runtime-version "$python_runtime_version"

          release_version="${GITHUB_REF_NAME#v}"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          if [[ "$release_version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  flight-recorder-gate:
    name: Flight Recorder cross-runtime gate
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci

      - name: Install Python runtime and test dependencies
        run: python -m pip install -e 'python[dev]'

      - name: Install required conformance binaries
        run: |
          RSB_SHA=7846dfdd5e2c74ea2201e1b141269df359b4ce5a
          KEYRING_SHA=89386724e9bf8b365ce3bd2847fbcc06365953d5
          curl -fsSL \
            "https://raw.githubusercontent.com/kody-w/rapp-secondbrain/$RSB_SHA/install.sh" \
            -o "$RUNNER_TEMP/rsb-install.sh"
          echo "6fbe9cf84a2b911384957743250e09bacb2c03a5be917974589255e89334d848  $RUNNER_TEMP/rsb-install.sh" \
            | sha256sum -c -
          RSB_REF="$RSB_SHA" bash "$RUNNER_TEMP/rsb-install.sh"

          curl -fsSL \
            "https://raw.githubusercontent.com/kody-w/rapp-keyring/$KEYRING_SHA/install.sh" \
            -o "$RUNNER_TEMP/keyring-install.sh"
          echo "a41a8e50f7a1a29212a402024bb65b8e9060e2b6f3bc4594b16d066ff666542c  $RUNNER_TEMP/keyring-install.sh" \
            | sha256sum -c -
          sed -i \
            "s|https://raw.githubusercontent.com/\${REPO}/main|https://raw.githubusercontent.com/\${REPO}/$KEYRING_SHA|" \
            "$RUNNER_TEMP/keyring-install.sh"
          bash "$RUNNER_TEMP/keyring-install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/rapp-keyring"
          test -x "$HOME/.local/bin/rsb"

      - name: Run the release acceptance gate
        run: node tools/flight-recorder-gate.mjs

  flight-recorder-windows:
    name: Flight Recorder Windows storage gate
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci

      - name: Install Python runtime and test dependencies
        run: python -m pip install -e "python[dev]"

      - name: Validate TypeScript Windows storage
        working-directory: typescript
        run: |
          npx vitest run src/flight-recorder/windows-storage.test.ts
          npm run build

      - name: Validate Python Windows storage
        working-directory: python
        run: python -m pytest tests/test_flight_recorder_windows.py -q

  show-and-tell-gate:
    name: Show-and-Tell ${{ matrix.os }} gate
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci

      - name: Install Python runtime and test dependencies
        run: python -m pip install -e "python[dev]"

      - name: Build TypeScript runtime
        working-directory: typescript
        run: npm run build:server

      - name: Run Show-and-Tell TypeScript tests
        working-directory: typescript
        run: >-
          npx vitest run
          src/show-and-tell/show-and-tell.test.ts
          src/show-and-tell/cross-runtime.test.ts
          src/agents/ComputerUseAgent.test.ts

      - name: Run Show-and-Tell Python tests
        working-directory: python
        run: python -m pytest -q tests/test_show_and_tell.py tests/test_computer_use_security.py

      - name: Exercise detached workers
        run: node tools/show-and-tell-smoke.mjs

  electron-desktop-gate:
    name: Electron desktop gate
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/ui/package-lock.json
            typescript/desktop/package-lock.json

      - name: Install and build OpenRappter core
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Install, compile, and test Electron desktop
        working-directory: typescript/desktop
        run: |
          npm ci
          npm run build
          npm test
          npm audit --audit-level=high

      - name: Run real Electron smoke
        working-directory: typescript/desktop
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a env OPENRAPPTER_DESKTOP_SMOKE=1 ./node_modules/.bin/electron .

  build-electron-artifacts:
    name: Build Electron ${{ matrix.os }}
    needs: [preflight, electron-desktop-gate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: mac
            runner: macos-14
          - os: win
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript/ui/package-lock.json
            typescript/desktop/package-lock.json

      - name: Build OpenRappter core and UI
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: typescript/desktop
        run: npm ci

      - name: Build desktop source
        working-directory: typescript/desktop
        run: npm run build

      - name: Prepare macOS notarization key
        id: notarization
        if: matrix.os == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          printf 'path=%s\n' "$key_path" >> "$GITHUB_OUTPUT"

      - name: Build signed desktop distributions
        working-directory: typescript/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os != 'linux' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.os == 'mac' && secrets.MACOS_CERTIFICATE_P12_BASE64 || matrix.os == 'win' && secrets.WINDOWS_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || matrix.os == 'win' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'mac' && steps.notarization.outputs.path || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'mac' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'mac' && secrets.APPLE_API_ISSUER_ID || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "mac" ]; then
            test -n "$CSC_LINK"
            test -n "$CSC_KEY_PASSWORD"
            test -n "$APPLE_API_KEY"
            test -n "$APPLE_API_KEY_ID"
            test -n "$APPLE_API_ISSUER"
          fi
          if [ "${{ matrix.os }}" = "win" ]; then
            test -n "$CSC_LINK"
            test -n "$CSC_KEY_PASSWORD"
          fi
          npx --no-install electron-builder --publish never

      - name: Smoke packaged macOS application
        if: matrix.os == 'mac'
        working-directory: typescript/desktop
        shell: bash
        run: |
          set -euo pipefail
          app_binary="$(
            find dist \
              -maxdepth 5 \
              -type f \
              -path '*/OpenRappter.app/Contents/MacOS/OpenRappter' \
              -print \
              -quit
          )"
          test -n "$app_binary"
          OPENRAPPTER_DESKTOP_SMOKE=1 "$app_binary"

      - name: Smoke packaged Linux application
        if: matrix.os == 'linux'
        working-directory: typescript/desktop
        shell: bash
        run: |
          set -euo pipefail
          test -x dist/linux-unpacked/openrappter
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          xvfb-run -a env OPENRAPPTER_DESKTOP_SMOKE=1 \
            dist/linux-unpacked/openrappter

      - name: Smoke packaged Windows application
        if: matrix.os == 'win'
        timeout-minutes: 5
        working-directory: typescript/desktop
        shell: pwsh
        run: |
          $env:OPENRAPPTER_DESKTOP_SMOKE = "1"
          $env:OPENRAPPTER_DESKTOP_SMOKE_SCOPE = "boot"
          .\dist\win-unpacked\OpenRappter.exe

      - name: Require signed and notarized macOS release
        if: matrix.os == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(
            find typescript/desktop/dist \
              -maxdepth 3 \
              -type d \
              -name 'OpenRappter.app' \
              -print \
              -quit
          )"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Require signed Windows release
        if: matrix.os == 'win'
        shell: pwsh
        run: |
          $installers = Get-ChildItem typescript/desktop/dist/*.exe
          if ($installers.Count -eq 0) {
            throw "No Windows installer was produced."
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
          }

      - name: Remove temporary notarization key
        if: always() && matrix.os == 'mac'
        shell: bash
        run: rm -f "${{ steps.notarization.outputs.path }}"

      - name: Upload desktop distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}-${{ needs.preflight.outputs.version }}
          path: |
            typescript/desktop/dist/*.dmg
            typescript/desktop/dist/*.zip
            typescript/desktop/dist/*.exe
            typescript/desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  build-artifacts:
    name: Materialize finalized candidate bytes without rebuild
    needs: [preflight, flight-recorder-gate, flight-recorder-windows, show-and-tell-gate, electron-desktop-gate]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download finalized beta candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' \
            https://raw.githubusercontent.com/kody-w/openrappter-release-train/main/heads/beta.json \
            -o beta-head.json
          authority="$(python -c 'import json; print(json.load(open("beta-head.json"))["authority_commit"])')"
          path="$(python -c 'import json; print(json.load(open("beta-head.json"))["receipt_path"])')"
          curl -fsSL --proto '=https' \
            "https://raw.githubusercontent.com/kody-w/openrappter-release-train/$authority/$path" \
            -o beta-receipt.json
          python - <<'PY'
          import json,os
          r=json.load(open("beta-receipt.json"))
          assert r["receipt_kind"]=="promotion"
          assert r["source_commit"]==os.environ["GITHUB_SHA"]
          assert r["source_tag"]==os.environ["GITHUB_REF_NAME"]
          assert r["version"]==os.environ["RELEASE_VERSION"]
          assert r["artifact_provenance"]=="github-candidate-bundle-sha256"
          PY
          url="$(python -c 'import json; print(json.load(open("beta-receipt.json"))["artifact_url"])')"
          sha="$(python -c 'import json; print(json.load(open("beta-receipt.json"))["artifact_sha256"])')"
          curl -fsSL --proto '=https' "$url" -o candidate.tar.gz
          echo "$sha  candidate.tar.gz" | sha256sum -c -
          mkdir release-dist
          tar -xzf candidate.tar.gz -C release-dist

      - name: Validate exact artifact names
        run: |
          node scripts/release-preflight.mjs \
            --tag "$GITHUB_REF_NAME" \
            --artifacts-dir release-dist

      - name: Verify candidate checksums without rebuilding
        working-directory: release-dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: release-dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  cycle-11-quality:
    name: Cycle 11 quality gates
    needs: [preflight, build-artifacts]
    uses: ./.github/workflows/ci.yml
    with:
      release_artifact_name: release-artifacts-${{ needs.preflight.outputs.version }}
    permissions:
      contents: read

  cycle-11-install:
    name: Cycle 11 install gates
    needs: [preflight, build-artifacts]
    uses: ./.github/workflows/install-smoke.yml
    with:
      release_artifact_name: release-artifacts-${{ needs.preflight.outputs.version }}
    permissions:
      contents: read

  smoke-artifacts:
    name: Smoke-install exact artifacts
    needs: [preflight, build-artifacts, cycle-11-quality, cycle-11-install]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: release-dist

      - name: Verify downloaded checksums
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Smoke-install npm tarball in a clean prefix
        shell: bash
        run: |
          set -euo pipefail
          npm install --global \
            --prefix "$RUNNER_TEMP/openrappter-npm-smoke" \
            "$PWD/release-dist/openrappter-${RELEASE_VERSION}.tgz"
          reported_version="$(
            "$RUNNER_TEMP/openrappter-npm-smoke/bin/openrappter" --version
          )"
          test "$reported_version" = "$RELEASE_VERSION"
          "$RUNNER_TEMP/openrappter-npm-smoke/bin/openrappter" show --help \
            | grep -qi "show-and-tell"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Smoke-install Python wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python_wheels=(release-dist/openrappter-*-py3-none-any.whl)
          test "${#python_wheels[@]}" -eq 1
          test -f "${python_wheels[0]}"
          python -m venv "$RUNNER_TEMP/openrappter-wheel-smoke"
          "$RUNNER_TEMP/openrappter-wheel-smoke/bin/pip" install \
            "${python_wheels[0]}"
          reported_version="$(
            "$RUNNER_TEMP/openrappter-wheel-smoke/bin/python" -c \
              'from openrappter import __version__; print(__version__, end="")'
          )"
          test "$reported_version" = "$RELEASE_VERSION"
          "$RUNNER_TEMP/openrappter-wheel-smoke/bin/openrappter" --version
          (
            cd "$RUNNER_TEMP"
            openrappter-wheel-smoke/bin/python -c 'import openrappter.show_and_tell, openrappter.show_and_tell_worker; from openrappter.cli import AgentRegistry; names = {item["name"] for item in AgentRegistry(load_skills=False).list_agents()}; assert "ShowAndTell" in names'
          )

      - name: Smoke-install Python sdist in a second clean environment
        shell: bash
        run: |
          set -euo pipefail
          python_sdists=(release-dist/openrappter-*.tar.gz)
          test "${#python_sdists[@]}" -eq 1
          test -f "${python_sdists[0]}"
          python -m venv "$RUNNER_TEMP/openrappter-sdist-smoke"
          "$RUNNER_TEMP/openrappter-sdist-smoke/bin/pip" install \
            "${python_sdists[0]}"
          reported_version="$(
            "$RUNNER_TEMP/openrappter-sdist-smoke/bin/python" -c \
              'from openrappter import __version__; print(__version__, end="")'
          )"
          test "$reported_version" = "$RELEASE_VERSION"
          "$RUNNER_TEMP/openrappter-sdist-smoke/bin/openrappter" --version
          (
            cd "$RUNNER_TEMP"
            openrappter-sdist-smoke/bin/python -c 'import openrappter.show_and_tell, openrappter.show_and_tell_worker; from openrappter.cli import AgentRegistry; names = {item["name"] for item in AgentRegistry(load_skills=False).list_agents()}; assert "ShowAndTell" in names'
          )

  release-constitution:
    needs: [preflight, build-artifacts]
    uses: ./.github/workflows/release-constitution.yml
    with:
      commit: ${{ github.sha }}
      tag: ${{ github.ref_name }}
      version: ${{ needs.preflight.outputs.version }}
      artifact_name: release-artifacts-${{ needs.preflight.outputs.version }}

  publish-registries:
    name: Reconcile and publish exact registry artifacts
    needs: [preflight, smoke-artifacts, build-electron-artifacts, release-constitution]
    runs-on: ubuntu-latest
    concurrency:
      group: openrappter-registry-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: release-dist

      - name: Verify downloaded checksums
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with Trusted Publishing support
        run: |
          npm install --global npm@11.5.1
          npm --version

      - name: Reconcile and stage missing PyPI artifacts
        id: pypi-state
        shell: bash
        run: |
          set -euo pipefail
          state="$(
            node scripts/release-preflight.mjs \
              --tag "$GITHUB_REF_NAME" \
              --artifacts-dir release-dist \
              --check-registry pypi \
              --stage-missing-dir pypi-dist
          )"
          case "$state" in
            absent|partial|matching) ;;
            *)
              printf 'Unexpected PyPI state: %q\n' "$state" >&2
              exit 1
              ;;
          esac
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Preflight npm artifact identity
        run: |
          node scripts/release-preflight.mjs \
            --tag "$GITHUB_REF_NAME" \
            --artifacts-dir release-dist \
            --check-registry npm

      - name: Publish only missing PyPI artifacts with OIDC
        if: steps.pypi-state.outputs.state != 'matching'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: pypi-dist/

      - name: Verify exact PyPI artifacts
        run: |
          node scripts/release-preflight.mjs \
            --tag "$GITHUB_REF_NAME" \
            --artifacts-dir release-dist \
            --check-registry pypi \
            --require-present

      - name: Reconcile npm tarball
        id: npm-state
        shell: bash
        run: |
          set -euo pipefail
          state="$(
            node scripts/release-preflight.mjs \
              --tag "$GITHUB_REF_NAME" \
              --artifacts-dir release-dist \
              --check-registry npm
          )"
          case "$state" in
            absent|matching) ;;
            *)
              printf 'Unexpected npm state: %q\n' "$state" >&2
              exit 1
              ;;
          esac
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"

      - name: Refresh release tags before npm publication
        if: steps.npm-state.outputs.state == 'absent'
        run: git fetch --force --tags origin

      - name: Select npm dist-tag after semver comparison
        if: steps.npm-state.outputs.state == 'absent'
        id: npm-tag
        shell: bash
        run: |
          set -euo pipefail
          publish_tag="$(
            node scripts/release-preflight.mjs \
              --npm-publish-tag-candidate "$RELEASE_VERSION" \
              --include-repository-tags
          )"
          historical_tag="release-${RELEASE_VERSION//./-}"
          case "$publish_tag" in
            latest|alpha|beta|rc|"$historical_tag") ;;
            *)
              printf 'Unexpected npm dist-tag: %q\n' "$publish_tag" >&2
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$publish_tag" >> "$GITHUB_OUTPUT"

      - name: Publish npm tarball with explicit semver-safe dist-tag
        if: steps.npm-state.outputs.state == 'absent'
        env:
          NPM_PUBLISH_TAG: ${{ steps.npm-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          npm publish \
            "release-dist/openrappter-${RELEASE_VERSION}.tgz" \
            --access public \
            --provenance \
            --tag "$NPM_PUBLISH_TAG"

      - name: Verify exact npm tarball
        run: |
          node scripts/release-preflight.mjs \
            --tag "$GITHUB_REF_NAME" \
            --artifacts-dir release-dist \
            --check-registry npm \
            --require-present

  github-release:
    name: Create checksummed GitHub Release
    needs: [preflight, publish-registries, build-electron-artifacts, release-constitution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts-${{ env.RELEASE_VERSION }}
          path: release-dist

      - name: Verify downloaded checksums
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*-${{ env.RELEASE_VERSION }}
          path: desktop-dist
          merge-multiple: true

      - name: Generate desktop checksums
        working-directory: desktop-dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-DESKTOP' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS-DESKTOP
          sha256sum --check SHA256SUMS-DESKTOP

      - name: Create GitHub Release with generated notes
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            release-dist/openrappter-${{ env.RELEASE_VERSION }}.tgz
            release-dist/openrappter-*-py3-none-any.whl
            release-dist/openrappter-*.tar.gz
            release-dist/SHA256SUMS
            desktop-dist/*.dmg
            desktop-dist/*.zip
            desktop-dist/*.exe
            desktop-dist/*.AppImage
            desktop-dist/SHA256SUMS-DESKTOP
