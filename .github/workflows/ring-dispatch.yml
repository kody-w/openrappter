name: Offer vetted main to nightly

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      vars.RING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed without cross-repository authority
        env:
          RING_AUTHORITY_TOKEN: ${{ secrets.RING_AUTHORITY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RING_AUTHORITY_TOKEN:-}" ]; then
            echo "::error::RING_ENABLED is true but RING_AUTHORITY_TOKEN is absent"
            exit 1
          fi
      - name: Dispatch exact vetted source candidate
        env:
          GH_TOKEN: ${{ secrets.RING_AUTHORITY_TOKEN }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$' ||
            { echo "::error::source commit is not 40 lowercase hex"; exit 1; }
          gh api repos/kody-w/openrappter-release-train/dispatches \
            -f event_type=nightly-candidate \
            -F "client_payload[source_repository]=kody-w/openrappter" \
            -F "client_payload[source_commit]=$SOURCE_COMMIT" \
            -F "client_payload[ci_run_id]=${{ github.event.workflow_run.id || github.run_id }}"
