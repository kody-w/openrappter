name: Receive stable ring promotion
on:
  repository_dispatch: { types: [ring-promotion, ring-receipt] }
permissions:
  contents: write
jobs:
  receive:
    if: github.event.sender.login == 'kody-w'
    uses: kody-w/openrappter-release-train/.github/workflows/receive.yml@2605992220cf1dec238fe0798f55452350219c81
    with:
      authority_commit: 2605992220cf1dec238fe0798f55452350219c81
      action: ${{ github.event.action }}
      payload_json: ${{ toJson(github.event.client_payload) }}
      target_ring: stable
      target_repository: kody-w/openrappter
