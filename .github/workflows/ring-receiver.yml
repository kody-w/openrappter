name: Receive stable ring promotion
on:
  repository_dispatch: { types: [ring-promotion, ring-receipt] }
permissions:
  contents: write
jobs:
  receive:
    if: github.event.sender.login == 'kody-w'
    uses: kody-w/openrappter-release-train/.github/workflows/receive.yml@3f84a14c56d4e0b13971a7f253cdf9d3dd7d310f
    with:
      authority_commit: 3f84a14c56d4e0b13971a7f253cdf9d3dd7d310f
      action: ${{ github.event.action }}
      payload_json: ${{ toJson(github.event.client_payload) }}
      target_ring: stable
      target_repository: kody-w/openrappter
