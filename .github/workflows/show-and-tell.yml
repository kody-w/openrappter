name: Show-and-Tell

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-runtime:
    name: ${{ matrix.os }} cross-runtime gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: npm ci

      - name: Install Python runtime and test dependencies
        run: python -m pip install -e "python[dev]"

      - name: Build TypeScript runtime
        working-directory: typescript
        run: npm run build:server

      - name: Run TypeScript contract and privacy tests
        working-directory: typescript
        run: >-
          npx vitest run
          src/show-and-tell/show-and-tell.test.ts
          src/show-and-tell/cross-runtime.test.ts
          src/agents/ComputerUseAgent.test.ts

      - name: Run Python contract and privacy tests
        working-directory: python
        run: python -m pytest -q tests/test_show_and_tell.py tests/test_computer_use_security.py

      - name: Exercise detached workers from built/runtime packages
        run: node tools/show-and-tell-smoke.mjs

      - name: Smoke install the npm artifact
        working-directory: typescript
        run: npm run test:package
