name: RappidField

options:
  bundleIdPrefix: com.openrappter
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RappidField:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: RAPPID Field
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrappter.rappidfield
        PRODUCT_NAME: RappidField
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  RappidFieldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RappidFieldTests
    dependencies:
      - target: RappidField
    info:
      path: Tests/RappidFieldTests/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openrappter.rappidfield.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/RappidField.app/RappidField
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  RappidField:
    build:
      targets:
        RappidField: all
        RappidFieldTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RappidFieldTests
