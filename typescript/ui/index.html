<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAPP Work · Your local AI workforce.</title>
    <meta name="description" content="RAPP Work — serious local AI for real business work. Your local AI workforce, work threads, approvals, evidence, and a shared local computer." />
    <meta name="application-name" content="RAPP Work" />
    <link rel="icon" type="image/svg+xml" href="./work-mark.svg" />
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("scoutTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
        --bg-primary: var(--cp-bg);
        --bg-secondary: var(--cp-bg-elevated);
        --bg-tertiary: var(--cp-surface-soft);
        --text-primary: var(--cp-text);
        --text-secondary: var(--cp-text-muted);
        --accent: var(--cp-accent);
        --accent-foreground: var(--cp-accent-fg);
        --accent-hover: var(--cp-accent-hover);
        --error: var(--cp-danger);
        --warning: var(--cp-warning);
        --border: var(--cp-border);
        --shadow: var(--cp-shadow);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }

      body {
        font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--cp-bg);
        color: var(--cp-text);
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <openrappter-app></openrappter-app>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
