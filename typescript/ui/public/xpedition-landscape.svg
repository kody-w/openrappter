<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">XPedition Valley</title>
  <desc id="desc">An original calm geometric landscape of layered blue and green ridges beneath a pale sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde7ff"/>
      <stop offset=".55" stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#fef5d6"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6b9fc2"/>
      <stop offset="1" stop-color="#3e7297"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4f9a6d"/>
      <stop offset="1" stop-color="#1c684c"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9acb6b"/>
      <stop offset=".52" stop-color="#55a45c"/>
      <stop offset="1" stop-color="#277954"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="140%">
